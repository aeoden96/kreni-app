name: Android build

# Builds the Capacitor Android app so native regressions (Gradle, plugins,
# manifest, and especially the R8 / resource-shrinking release path) are caught
# in CI. No signing secrets are needed: without android/keystore.properties the
# release build is produced unsigned, which still exercises minify/shrink.
on:
  workflow_call:
    inputs:
      upload_to_release:
        type: boolean
        required: false
        default: false
      tag_name:
        type: string
        required: false
  pull_request:
    branches: ['master', 'main']
    paths:
      - 'src/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/android.yml'
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Assemble debug + release (unsigned)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # webDir (dist) must exist before `cap sync` copies it into the native app.
      - name: Build web assets
        run: yarn build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Exercises R8 (minifyEnabled) + shrinkResources; unsigned since no keystore.
      - name: Bundle and assemble release (unsigned, validates R8)
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Release APK to GitHub Release
        if: ${{ inputs.upload_to_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          files: android/app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
