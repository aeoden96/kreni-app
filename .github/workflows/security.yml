name: Security

on:
  pull_request:
    branches: ['master', 'main']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block on high and critical CVEs in newly added packages.
          fail-on-severity: high
          # Copyleft / viral licenses that are incompatible with this project.
          deny-licenses: GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, AGPL-3.0
